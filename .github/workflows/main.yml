name: Extract pakart website

on:
  workflow_dispatch:
  push:
    paths:
      - "pakart-website.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o pakart-website.zip -d extracted

      - name: Move files to repository root
        run: |
          shopt -s dotglob

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            cp -R extracted/*/* .
          else
            cp -R extracted/* .
          fi

      - name: Remove ZIP and temporary files
        run: |
          rm -rf extracted
          rm -f pakart-website.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract pakart-website.zip"
            git push
          fi
