name: Extract pakart website

on:
  workflow_dispatch:
  push:
    paths:
      - "pakart.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o pakart.zip -d extracted

      - name: Show extracted files
        run: |
          echo "===== Contents of ZIP ====="
          find extracted -type f

      - name: Copy files to repository root
        run: |
          cp -R extracted/. .

      - name: Remove ZIP and temporary folder
        run: |
          rm -rf extracted
          rm -f pakart.zip

      - name: Show final files
        run: |
          echo "===== FINAL FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== GIT STATUS ====="
          git status

          git add -A

          echo "===== STAGED FILES ====="
          git status

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
          else
            git commit -m "Extract pakart website"
            git push origin HEAD:main
            echo "===== PUSH SUCCESSFUL ====="
          fi
