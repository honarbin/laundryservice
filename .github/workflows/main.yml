name: Extract pakart

on:
  workflow_dispatch:
  push:
    paths:
      - "pakart.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o pakart.zip -d extracted

      - name: Move site files to root
        run: |
          cp -R extracted/site/. .

      - name: Remove ZIP
        run: |
          rm -f pakart.zip
          rm -rf extracted

      - name: Show files
        run: |
          echo "===== FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "===== STATUS ====="
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract pakart website"
            git push origin HEAD:main
          fi
